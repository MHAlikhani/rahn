# RAHN CI: format, lint, test, execute, and check documentation on every push and PR.
# Main branch must remain stable; this workflow is the gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-features

  linux-execution:
    name: Real namespace execution (ADR 0012)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify iproute2 present
        run: ip netns list
      - name: Execute isolated topology (requires root for netns)
        # sudo switches HOME, so point rustup/cargo at the runner's
        # installation explicitly instead of overriding HOME.
        run: |
          sudo env RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"             PATH="$PATH" CARGO_TERM_COLOR=always CARGO_TARGET_DIR=target/root             $(which cargo) test -p rahn-exec --test linux_real -- --ignored --nocapture
      - name: Return root-owned build artifacts (if any)
        if: failure() || success()
        run: sudo chown -R $(id -u):$(id -g) target || true
      - name: Safety unit tests (host-safety invariant)
        run: cargo test -p rahn-exec

  license-check:
    name: License and documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical license files present
        run: |
          test -f LICENSE
          test -f LICENSES/Apache-2.0.txt
          test -f LICENSES/CC-BY-4.0.txt
          grep -q "Version 2.0, January 2004" LICENSE
      - name: Documentation SPDX headers (CC-BY-4.0)
        run: |
          missing=0
          for f in $(git ls-files '*.md' | grep -v '^README.md$'); do
            grep -q "SPDX-License-Identifier: CC-BY-4.0" "$f" || { echo "missing SPDX header: $f"; missing=1; }
          done
          exit $missing
      - name: Source SPDX headers (Apache-2.0)
        run: |
          missing=0
          for f in $(git ls-files '*.rs' 'crates/*/Cargo.toml' 'Cargo.toml'); do
            grep -q "SPDX-License-Identifier: Apache-2.0\|license.workspace = true\|license = \"Apache-2.0\"" "$f" || { echo "missing SPDX/license: $f"; missing=1; }
          done
          exit $missing

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links and SPDX headers
        run: python3 scripts/check_docs.py
