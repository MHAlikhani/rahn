# SPDX-License-Identifier: Apache-2.0
# Builds and deploys the RAHN website (site-src/ → site/) to GitHub Pages.

name: pages

on:
  push:
    branches: [main]
    paths: [site/**, site-src/**, scripts/build-site.mjs, scripts/validate-site.mjs, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node scripts/build-site.mjs
      - name: Validate site
        run: node scripts/validate-site.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
